[project]
name = "jandy-home-webui"
version = "0.1.0"
description = "Simple guest web UI for a Jandy iAqualink pool/spa"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Unreleased master: 0.7.0 on PyPI misroutes chill set point writes onto the pool
    # heat set point (flz/iaqualink-py#274). Pinned to a commit; bump deliberately.
    "iaqualink @ git+https://github.com/flz/iaqualink-py@eb1cf63e5ea89d38aa00d28a0662f60afdfc18ca",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
