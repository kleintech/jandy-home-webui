# One replica on purpose: the pod serializes commands to the Jandy and holds the
# polled state in memory; two pods would race each other's toggle commands.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pool
  labels:
    app.kubernetes.io/name: pool
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pool
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pool
    spec:
      securityContext:
        runAsNonRoot: true
        # The image runs as uid 1000. fsGroup makes the settings volume group-owned
        # by 1000 (group-writable) on provisioners that support it. hostPath-based
        # ones like k3s local-path ignore fsGroup; there /data is writable only
        # because local-path creates its directories mode 0777.
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      volumes:
        - name: config-data
          persistentVolumeClaim:
            claimName: pool-config-data
      containers:
        - name: pool
          # Tag is set in kustomization.yaml.
          image: registry.lab.kleincogroup.com/jandy-home-webui/pool
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          envFrom:
            - configMapRef:
                name: pool-config
            # iAqualink account. Not in git (public repo); create it by hand:
            #   kubectl -n <ns> create secret generic iaqualink-credentials \
            #     --from-literal=IAQUALINK_USERNAME=... --from-literal=IAQUALINK_PASSWORD=...
            # Optional so a dev deploy can run with JANDY_BACKEND=mock and no account;
            # in iaqualink mode a missing Secret exits with "IAQUALINK_USERNAME is not set".
            - secretRef:
                name: iaqualink-credentials
                optional: true
          # The root filesystem is read-only; saved settings live here.
          volumeMounts:
            - name: config-data
              mountPath: /data
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
